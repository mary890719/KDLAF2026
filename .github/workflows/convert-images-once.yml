name: Convert website images
on:
  push:
    branches: [codex/convert-webp-20261006]
    paths: [.github/workflows/convert-images-once.yml]
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - name: 轉換並驗證圖片
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageCms
          from io import BytesIO
          import subprocess
          # 僅轉換原有 WebP：archives 使用 JPG，其餘使用 PNG。
          paths = [Path(p) for p in subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0") if p.lower().endswith(".webp")]
          mapping = {}
          for source in paths:
              target = source.with_suffix(".jpg" if "archives" in source.parts else ".png")
              assert not target.exists(), target
              with Image.open(source) as original:
                  assert getattr(original, "n_frames", 1) == 1, source
                  size = original.size
                  alpha = original.getchannel("A").tobytes() if "A" in original.getbands() else None
                  im = original
                  # 將 CMYK 圖片轉為網頁使用的 RGB 色彩。
                  if im.mode == "CMYK" and im.info.get("icc_profile"):
                      im = ImageCms.profileToProfile(im, ImageCms.ImageCmsProfile(BytesIO(im.info["icc_profile"])), ImageCms.createProfile("sRGB"), outputMode="RGB")
                  if target.suffix == ".jpg":
                      bg = Image.new("RGBA", size, "white")
                      bg.alpha_composite(im.convert("RGBA"))
                      bg.convert("RGB").save(target, format="JPEG", quality=95, subsampling=0, optimize=True)
                  else:
                      im.convert("RGBA" if "A" in im.getbands() else "RGB").save(target, format="PNG")
              with Image.open(target) as check:
                  assert check.size == size, target
                  assert check.format == ("JPEG" if target.suffix == ".jpg" else "PNG"), target
                  if alpha is not None and target.suffix == ".png":
                      assert check.getchannel("A").tobytes() == alpha, target
                  check.load()
              mapping[str(source)] = str(target)
          # 只更新實際轉換圖片的引用；保留原本檔案格式與換行。
          for name in subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0"):
              path = Path(name)
              if path.suffix.lower() in {".html", ".css", ".js", ".json", ".md", ".txt", ".xml"}:
                  data = path.read_bytes()
                  updated = data
                  for old, new in mapping.items():
                      updated = updated.replace(old.encode(), new.encode())
                      updated = updated.replace(old.removeprefix("2026/").encode(), new.removeprefix("2026/").encode())
                  if updated != data:
                      path.write_bytes(updated)
          for source in paths:
              source.unlink()
          assert not list(Path("2026").rglob("*.webp"))
          assert len(paths) == 55
          print("Converted PNG:", sum(n.endswith(".png") for n in mapping.values()))
          print("Converted JPG:", sum(n.endswith(".jpg") for n in mapping.values()))
          # 完成後移除本次使用的暫存工作流程。
          Path(".github/workflows/convert-images-once.yml").unlink()
          PY
          git diff --check
          git add --all
          git -c user.name=Codex -c user.email=codex@openai.com commit -m "將網站圖片轉為PNG並將歷屆圖片轉為JPG"
          git push origin HEAD:codex/convert-webp-20261006
